name: Release Custom Builds (Windows, macOS Legacy, Linux 22.04)

on:
  workflow_dispatch: # Triggers ONLY when you manually click "Run workflow"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  # =========================================================================
  # 0. BUILD WEB UI ONCE FOR ALL JOBS (Matches repo ui-assets.cmake exactly)
  # =========================================================================
  ui-build:
    name: Build Web UI
    uses: ./.github/workflows/ui-build.yml

  # =========================================================================
  # 1. WINDOWS MODERN X64 CPU (Clang 20 + ThinLTO + All Variants)
  # =========================================================================
  windows-modern-cpu:
    name: Windows x64 (Modern CPU)
    needs: [ui-build]
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Install Ninja
        run: choco install ninja

      - name: Setup ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-modern-cpu-win-${{ runner.os }}
          evict-old-files: 1d

      - name: Build Modern x64 CPU
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -D CMAKE_C_FLAGS="-march=x86-64-v3 -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" ^
            -D CMAKE_CXX_FLAGS="-march=x86-64-v3 -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" ^
            -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -D GGML_NATIVE=OFF ^
            -D GGML_BACKEND_DL=ON ^
            -D GGML_CPU_ALL_VARIANTS=ON ^
            -D GGML_OPENMP=ON ^
            -D GGML_OPENMP_FETCH=ON ^
            -D GGML_BLAS=OFF ^
            -D LLAMA_BUILD_BORINGSSL=ON ^
            -D LLAMA_BUILD_SERVER=ON ^
            -D LLAMA_BUILD_TOOLS=ON ^
            -D GGML_RPC=ON ^
            -D LLAMA_CONNECT=ON ^
            -D LLAMA_BUILD_EXAMPLES=OFF ^
            -D LLAMA_BUILD_TESTS=OFF

          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Pack Windows Artifacts
        shell: cmd
        run: |
          copy LICENSE .\build\bin\Release\
          del /Q .\build\bin\Release\ggml-cpu-x64.dll 2>nul || true
          del /Q .\build\bin\Release\ggml-cpu-sse42.dll 2>nul || true
          del /Q .\build\bin\Release\ggml-cpu-sandybridge.dll 2>nul || true
          del /Q .\build\bin\Release\ggml-cpu-ivybridge.dll 2>nul || true
          del /Q .\build\bin\Release\ggml-cpu-piledriver.dll 2>nul || true

          (
            echo @echo off
            echo :: llama-server Optimized Windows Launcher
            echo set OMP_PROC_BIND=close
            echo set OMP_PLACES=cores
            echo set OMP_WAIT_POLICY=ACTIVE
            echo set OMP_DYNAMIC=false
            echo llama-server.exe --flash-attn on %%*
          ) > .\build\bin\Release\run-server-optimized.bat

          7z a -snl llama-bin-win-cpu-modern-x64.zip .\build\bin\Release\*

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-win-cpu-modern-x64
          path: llama-bin-win-cpu-modern-x64.zip
          retention-days: 14

  # =========================================================================
  # 2. WINDOWS ARM64 CPU TIERS (compat / balanced / modern)
  # =========================================================================
  windows-arm64:
    name: Windows ARM64 (${{ matrix.tier }})
    needs: [ui-build]
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: 'compat'
            march: 'armv8-a'
            forbid_regex: '\b(sdot|udot|smmla|usmmla|sudot)\b'
          - tier: 'balanced'
            march: 'armv8.2-a+dotprod'
            forbid_regex: '\b(smmla|usmmla|sudot)\b'
          - tier: 'modern'
            march: 'armv8.7-a+fp16+dotprod+i8mm'
            forbid_regex: ''

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Install Ninja
        run: choco install ninja

      - name: Setup ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-win-arm64-${{ matrix.tier }}-${{ runner.os }}
          evict-old-files: 1d

      - name: Build Windows ARM64 (${{ matrix.tier }})
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64
          set "ARM_FLAGS=-march=${{ matrix.march }} -fvectorize -ffp-model=fast -fno-finite-math-only -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH -Wno-format -Wno-unused-variable -Wno-unused-function -Wno-gnu-zero-variadic-macro-arguments"

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/arm64-windows-llvm.cmake ^
            -D CMAKE_C_FLAGS="%ARM_FLAGS%" ^
            -D CMAKE_CXX_FLAGS="%ARM_FLAGS%" ^
            -D CMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -D GGML_NATIVE=OFF ^
            -D GGML_CPU_ARM_ARCH=${{ matrix.march }} ^
            -D GGML_BACKEND_DL=OFF ^
            -D GGML_CPU_ALL_VARIANTS=OFF ^
            -D GGML_OPENMP=ON ^
            -D GGML_OPENMP_FETCH=ON ^
            -D GGML_BLAS=OFF ^
            -D LLAMA_BUILD_BORINGSSL=ON ^
            -D LLAMA_BUILD_SERVER=ON ^
            -D LLAMA_BUILD_TOOLS=ON ^
            -D GGML_RPC=ON ^
            -D LLAMA_CONNECT=OFF ^
            -D LLAMA_BUILD_EXAMPLES=OFF ^
            -D LLAMA_BUILD_TESTS=OFF

          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS%

      - name: Verify Emitted ARM64 Instructions (Static Disassembly Gate)
        shell: powershell
        run: |
          Write-Host "=== CMakeCache Compiler Flags ==="
          Select-String -Path build\CMakeCache.txt -Pattern "CMAKE_C_FLAGS:|CMAKE_CXX_FLAGS:|GGML_CPU_ARM_ARCH:" | ForEach-Object { $_.Line }

          $objdump = Get-Command llvm-objdump.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $objdump) {
            $candidates = @(
              "C:\Program Files\LLVM\bin\llvm-objdump.exe",
              "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\llvm-objdump.exe"
            )
            $objdump = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $objdump) {
            throw "llvm-objdump.exe not found; cannot verify emitted ARM64 instructions."
          }
          Write-Host "Using: $objdump"

          $bins = @(
            "build\bin\Release\ggml-cpu.dll",
            "build\bin\Release\ggml-base.dll",
            "build\bin\Release\llama.dll",
            "build\bin\Release\llama-server.exe"
          ) | Where-Object { Test-Path $_ }

          $forbid = '${{ matrix.forbid_regex }}'
          $cpuSdotCount = 0
          foreach ($bin in $bins) {
            $asm = & $objdump -d --triple=aarch64-pc-windows-msvc $bin
            $sdotCount = ($asm | Select-String -Pattern '\b(sdot|udot)\b').Count
            $i8mmCount = ($asm | Select-String -Pattern '\b(smmla|usmmla|sudot)\b').Count
            if ($bin -like '*ggml-cpu.dll') { $cpuSdotCount = $sdotCount }
            Write-Host "$bin -> sdot/udot: $sdotCount | smmla/usmmla/sudot (i8mm): $i8mmCount"

            if ($forbid) {
              $hits = $asm | Select-String -Pattern $forbid
              if ($hits.Count -gt 0) {
                $hits | Select-Object -First 10 | ForEach-Object { Write-Error $_.Line }
                throw "Forbidden instructions ($forbid) found in $bin for tier '${{ matrix.tier }}'!"
              }
            }
          }

          if ('${{ matrix.tier }}' -eq 'balanced' -and $cpuSdotCount -eq 0) {
            throw "Expected sdot/udot instructions in ggml-cpu.dll for 'balanced' tier, but found 0!"
          }

      - name: Pack Windows ARM64 Artifacts
        shell: cmd
        run: |
          copy LICENSE .\build\bin\Release\

          (
            echo @echo off
            echo :: llama-server Optimized Windows ARM64 Launcher (${{ matrix.tier }})
            echo set OMP_PROC_BIND=close
            echo set OMP_PLACES=cores
            echo set OMP_WAIT_POLICY=ACTIVE
            echo set OMP_DYNAMIC=false
            echo llama-server.exe --flash-attn on %%*
          ) > .\build\bin\Release\run-server-optimized.bat

          7z a -snl llama-bin-win-cpu-${{ matrix.tier }}-arm64.zip .\build\bin\Release\*

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-win-cpu-${{ matrix.tier }}-arm64
          path: llama-bin-win-cpu-${{ matrix.tier }}-arm64.zip
          retention-days: 14

  # =========================================================================
  # 3. MACOS LEGACY INTEL X64 (10.15+ Catalina, BLAS=OFF, Metal=OFF)
  # =========================================================================
  macos-legacy-intel:
    name: macOS Legacy Intel x64 (10.15+)
    needs: [ui-build]
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Install Ninja
        run: brew install ninja

      - name: Setup ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-legacy-macos-x64-${{ runner.os }}
          evict-old-files: 1d

      - name: Build macOS Legacy Binaries
        run: |
          cmake -S . -B build -G "Ninja Multi-Config" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BLAS=OFF \
            -DGGML_METAL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DGGML_RPC=ON \
            -DLLAMA_CONNECT=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF

          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Pack macOS Artifacts
        run: |
          cp LICENSE build/bin/Release/
          tar -czvf llama-bin-macos-legacy-x64.tar.gz -C build/bin/Release .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-macos-legacy-x64
          path: llama-bin-macos-legacy-x64.tar.gz
          retention-days: 14

  # =========================================================================
  # 4. LINUX UBUNTU 22.04 LTS (x64 & arm64 | CPU & Vulkan)
  # =========================================================================
  linux-ubuntu22:
    name: Linux (${{ matrix.arch }} - ${{ matrix.backend }})
    needs: [ui-build]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x64 Targets (GCC 13 + Static libstdc++) ---
          - arch: 'x64'
            backend: 'cpu'
            runner: 'ubuntu-22.04'
            gcc_version: '13'
            defines: '-DGGML_VULKAN=OFF'
          - arch: 'x64'
            backend: 'vulkan'
            runner: 'ubuntu-22.04'
            gcc_version: '13'
            defines: '-DGGML_VULKAN=ON'

          # --- arm64 Targets (GCC 14 for ARMv9.2 SME + Static libstdc++) ---
          - arch: 'arm64'
            backend: 'cpu'
            runner: 'ubuntu-22.04-arm'
            gcc_version: '14'
            defines: '-DGGML_VULKAN=OFF'
          - arch: 'arm64'
            backend: 'vulkan'
            runner: 'ubuntu-22.04-arm'
            gcc_version: '14'
            defines: '-DGGML_VULKAN=ON'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - name: Restore GCC ${{ matrix.gcc_version }} APT cache
        id: cache_gcc
        uses: actions/cache/restore@v4
        with:
          path: /tmp/gcc-apt-cache
          key: ubuntu22-gcc-${{ matrix.gcc_version }}-${{ matrix.arch }}-${{ matrix.backend }}-v1
          restore-keys: |
            ubuntu22-gcc-${{ matrix.gcc_version }}-${{ matrix.arch }}-

      - name: Setup Toolchain (GCC ${{ matrix.gcc_version }} on Ubuntu 22.04)
        id: setup_toolchain
        run: |
          set -euo pipefail
          GCC_VER="${{ matrix.gcc_version }}"
          APT_OPTS=(
            -o Acquire::Retries=8
            -o Acquire::http::Pipeline-Depth=0
            -o Acquire::https::Pipeline-Depth=0
            -o Acquire::Queue-Mode=host
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )

          sudo apt-get update "${APT_OPTS[@]}"
          sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" \
            build-essential cmake ninja-build libssl-dev ca-certificates software-properties-common

          INSTALLED=0
          if compgen -G "/tmp/gcc-apt-cache/*.deb" > /dev/null; then
            echo "Installing gcc-${GCC_VER} / g++-${GCC_VER} from cached .deb packages..."
            if sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" /tmp/gcc-apt-cache/*.deb; then
              INSTALLED=1
            else
              echo "Cached .deb install failed; falling back to PPA download..."
            fi
          fi

          if [ "$INSTALLED" -eq 0 ]; then
            sudo apt-get clean
            for k in 1 2 3; do
              sudo add-apt-repository -y -n ppa:ubuntu-toolchain-r/test && break || sleep 10
            done

            MIRRORS=(
              "https://ppa.launchpadcontent.net"
              "https://ppa.launchpadcontent.net"
              "http://ppa.launchpadcontent.net"
              "https://ppa.launchpad.net"
              "https://launchpad.proxy.ustclug.org"
              "https://ppa.launchpadcontent.net"
            )

            DOWNLOADED=0
            for idx in "${!MIRRORS[@]}"; do
              MIRROR="${MIRRORS[$idx]}"
              ATTEMPT=$((idx + 1))
              echo "Downloading gcc-${GCC_VER} / g++-${GCC_VER} via ${MIRROR} (attempt ${ATTEMPT}/${#MIRRORS[@]})..."
              sudo find /etc/apt/sources.list.d -maxdepth 1 -name '*ubuntu-toolchain*' -type f -exec \
                sed -i -E "s#https?://(ppa\.launchpadcontent\.net|ppa\.launchpad\.net|launchpad\.proxy\.ustclug\.org)#${MIRROR}#g" {} +

              sudo apt-get update "${APT_OPTS[@]}" || true
              if sudo apt-get install -d -y --no-install-recommends --fix-missing "${APT_OPTS[@]}" \
                "gcc-${GCC_VER}" "g++-${GCC_VER}"; then
                DOWNLOADED=1
                break
              fi
              sleep $((ATTEMPT * 10))
            done

            if [ "$DOWNLOADED" -ne 1 ]; then
              echo "::error::Failed to download gcc-${GCC_VER} / g++-${GCC_VER} from Launchpad and fallback mirrors."
              exit 1
            fi

            sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" "gcc-${GCC_VER}" "g++-${GCC_VER}"
            mkdir -p /tmp/gcc-apt-cache
            rm -f /tmp/gcc-apt-cache/*.deb
            cp /var/cache/apt/archives/*.deb /tmp/gcc-apt-cache/
            chmod -R a+rX /tmp/gcc-apt-cache
            echo "save_cache=true" >> "$GITHUB_OUTPUT"
          fi

          "gcc-${GCC_VER}" --version
          echo "CC=gcc-${GCC_VER}" >> "$GITHUB_ENV"
          echo "CXX=g++-${GCC_VER}" >> "$GITHUB_ENV"

      - name: Save GCC ${{ matrix.gcc_version }} APT cache
        if: ${{ steps.cache_gcc.outputs.cache-hit != 'true' || steps.setup_toolchain.outputs.save_cache == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/gcc-apt-cache
          key: ubuntu22-gcc-${{ matrix.gcc_version }}-${{ matrix.arch }}-${{ matrix.backend }}-v1

      - name: Setup Vulkan Dependencies
        if: ${{ matrix.backend == 'vulkan' }}
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # LunarG Jammy repository for x64
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -y
            sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-sdk
          else
            # 1. Install base loader and Mesa drivers
            sudo apt-get install -y libvulkan-dev spirv-headers spirv-tools mesa-vulkan-drivers

            # 2. Download ARM64 Vulkan 1.4 SDK (provides both glslc and modern Vulkan 1.4 headers)
            SDK_VER="1.4.321.1"
            echo "Fetching ARM64 Vulkan 1.4 SDK..."
            curl -fsSL "https://github.com/jakoch/vulkan-sdk-arm/releases/download/${SDK_VER}/vulkansdk-ubuntu-22.04-arm-${SDK_VER}.tar.xz" -o /tmp/vulkan-sdk.tar.xz
            sudo mkdir -p /opt/vulkan-sdk
            sudo tar -xJf /tmp/vulkan-sdk.tar.xz -C /opt/vulkan-sdk
            rm -f /tmp/vulkan-sdk.tar.xz

            # Locate the extracted SDK directory
            VDIR=$(find /opt/vulkan-sdk -type d -name "aarch64" | head -n 1)

            # 3. Copy glslc compiler to /usr/local/bin
            sudo cp "${VDIR}/bin/glslc" /usr/local/bin/
            sudo chmod +x /usr/local/bin/glslc

            # 4. Overwrite ancient Ubuntu 22.04 headers with modern Vulkan 1.4.321 headers
            sudo cp -r ${VDIR}/include/* /usr/include/

            # 5. Set environment variables
            echo "VULKAN_SDK=${VDIR}" >> "$GITHUB_ENV"
            echo "${VDIR}/bin" >> "$GITHUB_PATH"
            echo "CMAKE_PREFIX_PATH=${VDIR}" >> "$GITHUB_ENV"

            glslc --version
          fi

      - name: Setup ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-ubuntu22-${{ matrix.arch }}-${{ matrix.backend }}-v7
          evict-old-files: 1d

      - name: Build Linux Binaries
        run: |
          # Apply static libgcc and libstdc++ across executables, shared libraries, and dynamic CPU modules
          STATIC_LIBS="-static-libgcc -static-libstdc++"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="${STATIC_LIBS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${STATIC_LIBS}" \
            -DCMAKE_MODULE_LINKER_FLAGS="${STATIC_LIBS}" \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_OPENMP=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DGGML_RPC=ON \
            -DLLAMA_CONNECT=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            ${{ matrix.defines }}

          cmake --build build --config Release -j $(nproc)

      - name: Verify Clean GLIBC & libstdc++ Decoupling
        run: |
          echo "=== 1. Checking NEEDED libraries (libstdc++.so must NOT be listed) ==="
          [ -f build/bin/llama-server ] && readelf -d build/bin/llama-server | grep NEEDED || true
          [ -f build/bin/libllama-server-impl.so ] && readelf -d build/bin/libllama-server-impl.so | grep NEEDED || true

          echo "=== 2. Checking symbol versions (GLIBCXX must NOT appear) ==="
          [ -f build/bin/libllama-server-impl.so ] && objdump -p build/bin/libllama-server-impl.so | grep GLIBCXX || true

      - name: Pack Linux Artifacts
        run: |
          cp LICENSE build/bin/
          tar -czvf llama-bin-ubuntu22-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz -C build/bin .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-bin-ubuntu22-${{ matrix.arch }}-${{ matrix.backend }}
          path: llama-bin-ubuntu22-${{ matrix.arch }}-${{ matrix.backend }}.tar.gz
          retention-days: 14
